  <title id="title">IELTop — rounded logo</title>
  <desc id="desc">Vector reconstruction of the supplied IELTop logo: three rising metallic ribbons, a gold star and silver and gold lettering on a dark blue n=3 superellipse background with transparent outer corners and a uniform border. All lettering is outlined; no embedded bitmap or external font is used.</desc>
