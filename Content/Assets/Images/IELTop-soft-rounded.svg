<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="505" height="504" viewBox="0 0 505 504" role="img" aria-labelledby="title desc">
  <title id="title">IELTop — soft rounded logo</title>
  <desc id="desc">Vector reconstruction of the supplied IELTop logo: three rising metallic ribbons, a gold star and silver and gold lettering on a dark blue rounded rectangle with a 60-unit corner radius, uniform border and transparent outer corners. All lettering is outlined; no embedded bitmap or external font is used.</desc>
